# The iOS app for the owner's private build repo, compiled here because a public repo's runners are free.
#
# Started by hand (Actions > Private app build > Run workflow) or by the private repo's Build workflow; never on a
# pull request. It fetches the owner's sh3.exe (only the start of the first game-file zip in the private repo's
# "game-files" release, with the BUILD_TOKEN secret), turns it into C as tools/regen.sh does, compiles the app and
# uploads SH3.ipa straight back to the private repo's "app" release. Nothing of the game is kept here, and nothing
# of it reaches this public log:
#   - no cache holds anything of the game (only Python packages, SDL2 and ANGLE, which are public);
#   - the generator's and the compiler's output go to files; on failure only the error lines from the port's own
#     sources are shown, and the whole log goes to the private repo (release "build-logs");
#   - the exe, the generated code and the app are deleted at the end, whatever happened.
# How it is set up, and how to do the same for another game: the owner's jk-files repo, docs/FREE_MAC_BUILDS.md.
name: Private app build
on:
  workflow_dispatch:
    inputs:
      private_repo:
        description: "The private repo with the game files, which receives the app"
        default: sithewok13-dev/sh3-ios-build
      port_ref:
        description: "Branch or commit of this repo to build"
        default: ios
      bundle_id:
        description: "The app's bundle identifier"
        default: com.sithewok.sh3

permissions:
  contents: read

concurrency:
  group: private-app
  cancel-in-progress: false

jobs:
  # ANGLE (OpenGL ES on Metal, the app's renderer), built from its public source by the port's
  # tools/ios/build-angle.sh and kept in this repo's cache, keyed by that script: an hour or two the first time,
  # seconds after that. Nothing of the game is here.
  angle:
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.port_ref }}
          path: port
          persist-credentials: false  # nothing of Chromium's build tools gets a token

      - name: ANGLE in the cache?
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: port/build/angle
          key: angle-ios-${{ hashFiles('port/tools/ios/build-angle.sh') }}
          lookup-only: true

      - name: Build ANGLE (only when the cache has none)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet /usr/local/lib/node_modules || true
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version | head -1
          df -h / | tail -1
          ANGLE_WORK="$RUNNER_TEMP/angle" port/tools/ios/build-angle.sh > angle.log 2>&1 || { tail -80 angle.log; exit 1; }
          tail -8 angle.log

      - name: Keep ANGLE in the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: port/build/angle
          key: ${{ steps.cache.outputs.cache-primary-key }}

  app:
    needs: angle
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.port_ref }}
          path: port

      - name: sh3.exe from the private repo (the first file in SH3-game-1.zip; only the zip's start is fetched)
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
          REPO: ${{ inputs.private_repo }}
        run: |
          url=$(gh api "repos/$REPO/releases/tags/game-files" --jq '.assets[] | select(.name=="SH3-game-1.zip") | .url')
          curl -fsSL -r 0-15999999 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$url" -o zip-start.bin
          mkdir -p game
          python3 - <<'PY'
          import struct, zlib
          b, at = open('zip-start.bin', 'rb').read(), 0
          while True:
              sig, _, flags, method, _, _, crc, csize, usize, fnlen, exlen = struct.unpack_from('<IHHHHHIIIHH', b, at)
              assert sig == 0x04034B50, 'not a zip'
              name, start = b[at + 30:at + 30 + fnlen].decode(), at + 30 + fnlen + exlen
              if name == 'sh3.exe': break
              at = start + csize
          raw = b[start:start + csize]
          exe = zlib.decompressobj(-15).decompress(raw) if method == 8 else raw
          assert len(exe) == usize and zlib.crc32(exe) == crc, 'damaged'
          open('game/sh3.exe', 'wb').write(exe)
          PY
          rm zip-start.bin
          # the retail exe the port was made for, or the owner's copy (same build, a few bytes patched; checked to recompile)
          case "$(shasum game/sh3.exe | cut -d' ' -f1)" in
            aa2aca6dba19bf510c9c2e92eefdc15e98266581|d851669ef609b3164e3581aa8dcfbfaec866cb79) ;;
            *) echo "::error::not the exe the port is made for"; exit 1 ;;
          esac

      - uses: actions/cache@v4  # Python packages only
        with:
          path: ~/Library/Caches/pip
          key: pip-${{ hashFiles('port/requirements.txt') }}

      - name: The game's code, generated from sh3.exe
        run: |
          brew install ninja >/dev/null
          cd port
          python3 -m venv .venv > /dev/null
          .venv/bin/pip install -q -r requirements.txt > /dev/null
          ln -s ../game game
          tools/regen.sh > ../regen.log 2>&1 || { echo "::error::the generator failed"; grep -iE "error|Traceback" ../regen.log | grep -v "recomp/gen" | head -20; exit 1; }
          rm ../game/sh3.exe
          echo "generated $(ls src/recomp/gen | wc -l | tr -d ' ') files"

      - uses: actions/cache@v4  # SDL2 only: nothing of the game
        with:
          path: port/build/ios-deps
          key: ios-deps-${{ hashFiles('port/tools/ios/build-deps.sh') }}

      - name: SDL2 for iOS
        run: port/tools/ios/build-deps.sh > deps.log 2>&1 || { tail -40 deps.log; exit 1; }

      - name: ANGLE from the cache (the angle job above)
        uses: actions/cache/restore@v4
        with:
          path: port/build/angle
          key: angle-ios-${{ hashFiles('port/tools/ios/build-angle.sh') }}
          fail-on-cache-miss: true

      - name: The app
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          cmake -S port -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-w \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DSH2_IOS_BUNDLE_ID="$BUNDLE_ID" -DSH2_IOS_BUILD="$GITHUB_RUN_NUMBER" \
            -DSH2_IOS_DEPS="$PWD/port/build/ios-deps" > build.log 2>&1 &&
          cmake --build build >> build.log 2>&1 || {
            echo "::error::the build failed; errors in the port's own sources (the whole log is in the private repo's build-logs release):"
            grep -E "error" build.log | grep -v "recomp/gen" | head -30
            exit 1
          }
          # ANGLE is bundled, and the app does not link it or Apple's OpenGL ES's entry points (src/runtime/ios_angle.m)
          ls build/SH3.app/Frameworks/libEGL.framework/libEGL build/SH3.app/Frameworks/libGLESv2.framework/libGLESv2 > /dev/null
          if otool -L build/SH3.app/SH3 | grep -qE 'libEGL|libGLESv2'; then echo "::error::the app links ANGLE"; exit 1; fi
          # the build stamp under the tray ("build 80 · Nov 9") and on the release's first line
          day=$(date -u +%F); echo "SW_BUILD_DATE=$day" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Add :SWBuildNumber string $GITHUB_RUN_NUMBER" -c "Add :SWBuildDate string $day" \
            build/SH3.app/Info.plist
          mkdir Payload && cp -R build/SH3.app Payload/ && zip -qr SH3.ipa Payload
          echo "SH3.ipa: $(du -h SH3.ipa | cut -f1), build $GITHUB_RUN_NUMBER"

      - name: SH3.ipa to the private repo's "app" release
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
          REPO: ${{ inputs.private_repo }}
        run: |
          gh release view app -R "$REPO" >/dev/null 2>&1 || \
            gh release create app -R "$REPO" --title "App" --notes "Unsigned SH3.ipa: open it in Feather to sign and install it."
          gh release upload app SH3.ipa --clobber -R "$REPO"
          # the builds page reads "Build N · YYYY-MM-DD" from the body's first line; the rest stays
          gh release view app -R "$REPO" --json body --jq .body | sed -e '1{/^Build [0-9]* · /d;}' | sed -e '/./,$!d' > body.md
          { printf 'Build %s · %s\n\n' "$GITHUB_RUN_NUMBER" "$SW_BUILD_DATE"; cat body.md; } > notes.md
          gh release edit app -R "$REPO" --notes-file notes.md
          head -1 notes.md

      - name: The logs to the private repo, if something failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN }}
          REPO: ${{ inputs.private_repo }}
        run: |
          ls regen.log build.log 2>/dev/null || exit 0
          gh release view build-logs -R "$REPO" >/dev/null 2>&1 || \
            gh release create build-logs -R "$REPO" --title "Build logs" --notes "The public Mac build's full logs."
          for f in regen.log build.log; do [ -f "$f" ] && gh release upload build-logs "$f" --clobber -R "$REPO"; done; true

      - name: Nothing of the game left behind
        if: always()
        run: rm -rf game zip-start.bin port/src/recomp/gen port/build/sh3* port/build/disasm port/build/recomp port/build/func_id port/build/abi port/build/*.json port/build/*.log build Payload SH3.ipa build.log regen.log body.md notes.md
